version: '3.8'

services:
  app:
    build: .
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_PROVIDER=postgresql
      - DATABASE_URL=postgresql://landings:${POSTGRES_PASSWORD:-landings}@db:5432/landings?schema=public
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM:-noreply@gestorlandings.com}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://tudominio.com}
      - APP_URL=${APP_URL:-https://tudominio.com}
      - LOG_LEVEL=info
      - FTP_ENCRYPTION_KEY=${FTP_ENCRYPTION_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server/uploads:/app/server/uploads
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=landings
      - POSTGRES_USER=landings
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-landings}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U landings -d landings"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: